```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix IP Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0c0c0e;
            color: #a1a1aa;
            font-family: 'monospace';
            overflow-x: hidden;
        }
        .stream-grid {
            display: grid;
            gap: 10px;
            padding: 20px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
        .node-card {
            background: #161618;
            border: 1px solid #27272a;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .ip-footer {
            padding: 5px 10px;
            font-size: 10px;
            background: #111;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #27272a;
        }
        .status-led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 5px #22c55e;
        }
    </style>
</head>
<body>

    <div class="sticky top-0 z-50 bg-black/80 backdrop-blur border-b border-zinc-800 p-4">
        <div class="flex flex-wrap items-center gap-4 justify-between">
            <div>
                <h1 class="text-white font-bold text-sm tracking-widest uppercase">Global Node Monitor</h1>
                <p class="text-[9px] text-zinc-500">SISTEMA DE IDENTIFICACIÓN IP ÚNICA</p>
            </div>

            <div class="flex gap-2">
                <input type="text" id="videoInput" placeholder="ID de Video (ej: jfKfPfyJRdk)" 
                       class="bg-zinc-900 border border-zinc-700 px-3 py-1 text-xs text-white w-48 focus:border-blue-500 outline-none">
                <input type="number" id="countInput" value="12" 
                       class="bg-zinc-900 border border-zinc-700 px-2 py-1 text-xs text-white w-16 outline-none">
                <button onclick="generateNodes()" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] px-4 py-1 font-bold uppercase transition-all">
                    Sincronizar
                </button>
            </div>
        </div>
    </div>

    <div id="gridContainer" class="stream-grid">
        <!-- Los nodos aparecerán aquí -->
    </div>

    <script>
        function getRandomIP() {
            return `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
        }

        function extractID(input) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = input.match(regExp);
            return (match && match[7].length == 11) ? match[7] : (input || "jfKfPfyJRdk");
        }

        function generateNodes() {
            const container = document.getElementById('gridContainer');
            const videoId = extractID(document.getElementById('videoInput').value);
            const count = Math.min(parseInt(document.getElementById('countInput').value) || 1, 100);
            
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const node = document.createElement('div');
                node.className = 'node-card';
                
                const ip = getRandomIP();
                
                // Usamos youtube-nocookie.com para mayor compatibilidad
                // mute=1 es OBLIGATORIO para que el navegador permita el autoplay
                node.innerHTML = `
                    <div class="video-box">
                        <iframe 
                            src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0" 
                            allow="autoplay; encrypted-media" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="ip-footer">
                        <span><span class="status-led"></span>IP: ${ip}</span>
                        <span class="text-zinc-600">PORT: 8080</span>
                    </div>
                `;
                
                container.appendChild(node);
            }
        }

        // Ejecutar al cargar
        window.onload = generateNodes;
    </script>
</body>
</html>

```
