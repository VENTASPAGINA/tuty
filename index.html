<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Meta de Ahorro</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}
body {
    min-height: 100vh;
    background: #f4f6f8;
    color: #17202a;
}
.app {
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
    background: #ffffff;
}
/* ENCABEZADO */
.header {
    background: linear-gradient(135deg, #111827, #263449);
    color: white;
    padding: 30px 22px 45px;
    border-radius: 0 0 30px 30px;
}
.header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}
.header p {
    color: #cbd5e1;
}
/* CONTENIDO */
.content {
    padding: 20px;
    margin-top: -25px;
}
/* TARJETAS */
.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}
.card h2 {
    font-size: 19px;
    margin-bottom: 18px;
}
/* FORMULARIO */
label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin: 15px 0 7px;
    color: #4b5563;
}
input {
    width: 100%;
    padding: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    background: #f9fafb;
}
input:focus {
    border-color: #22c55e;
}
/* BOTONES */
button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 15px;
    margin-top: 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.btn-primary {
    background: #22c55e;
    color: white;
}
.btn-primary:hover {
    background: #16a34a;
}
.btn-danger {
    background: #fee2e2;
    color: #dc2626;
}
/* PROGRESO */
.progress-card {
    text-align: center;
}
.progress-circle {
    width: 190px;
    height: 190px;
    margin: 20px auto;
    border-radius: 50%;
    background: conic-gradient(#22c55e 0%, #e5e7eb 0%);
    display: flex;
    align-items: center;
    justify-content: center;
}
.progress-inner {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}
.progress-inner strong {
    font-size: 32px;
}
.progress-inner span {
    color: #6b7280;
    font-size: 13px;
}
/* ESTADÍSTICAS */
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.stat {
    padding: 15px;
    background: #f8fafc;
    border-radius: 15px;
}
.stat small {
    color: #6b7280;
    display: block;
    margin-bottom: 6px;
}
.stat strong {
    font-size: 18px;
}
/* COLORES */
.green {
    color: #16a34a;
}
.red {
    color: #dc2626;
}
.blue {
    color: #2563eb;
}
.orange {
    color: #ea580c;
}
/* DEPÓSITO */
.deposit-box {
    display: flex;
    gap: 10px;
}
.deposit-box input {
    flex: 1;
}
.deposit-box button {
    width: 100px;
    margin-top: 0;
}
/* MENSAJE */
.message {
    margin-top: 18px;
    padding: 14px;
    border-radius: 12px;
    background: #ecfdf5;
    color: #166534;
    font-size: 14px;
    line-height: 1.5;
}
/* OCULTO */
.hidden {
    display: none;
}
</style>
</head>
<body>
<div class="app">
    <header class="header">
        <h1>💰 Mi Meta de Ahorro</h1>
        <p>
            Organiza tu dinero y alcanza tus objetivos.
        </p>
    </header>
    <main class="content">
        <!-- CREAR META -->
        <section class="card">
            <h2>🎯 Configura tu meta</h2>
            <label>Nombre de tu meta</label>
            <input
                type="text"
                id="nombreMeta"
                placeholder="Ej: Comprar una motocicleta"
            >
            <label>¿Cuánto quieres ahorrar?</label>
            <input
                type="number"
                id="meta"
                placeholder="Ej: 100000"
            >
            <label>¿Cuánto tienes ahorrado actualmente?</label>
            <input
                type="number"
                id="ahorrado"
                placeholder="Ej: 10000"
            >
            <label>Fecha límite</label>
            <input
                type="date"
                id="fechaMeta"
            >
            <button
                class="btn-primary"
                onclick="guardarMeta()"
            >
                💾 GUARDAR MI META
            </button>
        </section>
        <!-- PANEL DE RESULTADOS -->
        <section
            class="card progress-card hidden"
            id="panelResultados"
        >
            <h2 id="tituloMeta">
                Mi meta
            </h2>
            <div
                class="progress-circle"
                id="progressCircle"
            >
                <div class="progress-inner">
                    <strong id="porcentaje">
                        0%
                    </strong>
                    <span>
                        completado
                    </span>
                </div>
            </div>
            <div class="stats">
                <div class="stat">
                    <small>🎯 Meta total</small>
                    <strong
                        id="resultadoMeta"
                        class="blue"
                    >
                        $0
                    </strong>
                </div>
                <div class="stat">
                    <small>💰 Ahorrado</small>
                    <strong
                        id="resultadoAhorrado"
                        class="green"
                    >
                        $0
                    </strong>
                </div>
                <div class="stat">
                    <small>📉 Falta</small>
                    <strong
                        id="resultadoFalta"
                        class="red"
                    >
                        $0
                    </strong>
                </div>
                <div class="stat">
                    <small>📅 Días restantes</small>
                    <strong
                        id="diasRestantes"
                        class="orange"
                    >
                        0
                    </strong>
                </div>
            </div>
            <div
                class="message"
                id="mensaje"
            ></div>
        </section>
        <!-- CUÁNTO AHORRAR -->
        <section
            class="card hidden"
            id="planAhorro"
        >
            <h2>📊 Tu plan de ahorro</h2>
            <div class="stats">
                <div class="stat">
                    <small>Por día</small>
                    <strong
                        id="porDia"
                        class="blue"
                    >
                        $0
                    </strong>
                </div>
                <div class="stat">
                    <small>Por semana</small>
                    <strong
                        id="porSemana"
                        class="green"
                    >
                        $0
                    </strong>
                </div>
                <div class="stat">
                    <small>Por mes</small>
                    <strong
                        id="porMes"
                        class="orange"
                    >
                        $0
                    </strong>
                </div>
            </div>
        </section>
        <!-- REGISTRAR AHORRO -->
        <section
            class="card hidden"
            id="panelDeposito"
        >
            <h2>➕ Registrar nuevo ahorro</h2>
            <div class="deposit-box">
                <input
                    type="number"
                    id="nuevoAhorro"
                    placeholder="Cantidad"
                >
                <button
                    class="btn-primary"
                    onclick="agregarAhorro()"
                >
                    AGREGAR
                </button>
            </div>
        </section>
        <!-- ELIMINAR -->
        <section
            class="card hidden"
            id="panelEliminar"
        >
            <button
                class="btn-danger"
                onclick="eliminarDatos()"
            >
                🗑️ ELIMINAR TODOS MIS DATOS
            </button>
        </section>
    </main>
</div>
<script>
/* FORMATO DE DINERO */
function dinero(valor) {
    return new Intl.NumberFormat(
        "es-US",
        {
            style: "currency",
            currency: "USD"
        }
    ).format(valor);
}
/* GUARDAR META */
function guardarMeta() {
    const nombre =
        document.getElementById("nombreMeta").value;
    const meta =
        Number(document.getElementById("meta").value);
    const ahorrado =
        Number(document.getElementById("ahorrado").value);
    const fecha =
        document.getElementById("fechaMeta").value;
    if (
        nombre === "" ||
        meta <= 0 ||
        ahorrado < 0 ||
        fecha === ""
    ) {
        alert(
            "Completa todos los campos correctamente."
        );
        return;
    }
    const datos = {
        nombre: nombre,
        meta: meta,
        ahorrado: ahorrado,
        fecha: fecha
    };
    localStorage.setItem(
        "miSistemaDeAhorro",
        JSON.stringify(datos)
    );
    mostrarDatos();
}
/* MOSTRAR DATOS */
function mostrarDatos() {
    const datosGuardados =
        localStorage.getItem(
            "miSistemaDeAhorro"
        );
    if (!datosGuardados) {
        return;
    }
    const datos =
        JSON.parse(datosGuardados);
    document.getElementById(
        "nombreMeta"
    ).value = datos.nombre;
    document.getElementById(
        "meta"
    ).value = datos.meta;
    document.getElementById(
        "ahorrado"
    ).value = datos.ahorrado;
    document.getElementById(
        "fechaMeta"
    ).value = datos.fecha;
    document.getElementById(
        "panelResultados"
    ).classList.remove("hidden");
    document.getElementById(
        "planAhorro"
    ).classList.remove("hidden");
    document.getElementById(
        "panelDeposito"
    ).classList.remove("hidden");
    document.getElementById(
        "panelEliminar"
    ).classList.remove("hidden");
    actualizarSistema(datos);
}
/* ACTUALIZAR TODO */
function actualizarSistema(datos) {
    const meta = datos.meta;
    const ahorrado = datos.ahorrado;
    let falta = meta - ahorrado;
    if (falta < 0) {
        falta = 0;
    }
    let porcentaje =
        (ahorrado / meta) * 100;
    if (porcentaje > 100) {
        porcentaje = 100;
    }
    const hoy = new Date();
    const fechaFinal =
        new Date(datos.fecha);
    const diferencia =
        fechaFinal - hoy;
    let dias = Math.ceil(
        diferencia /
        (1000 * 60 * 60 * 24)
    );
    if (dias < 0) {
        dias = 0;
    }
    const ahorroDiario =
        falta / dias;
    const ahorroSemanal =
        ahorroDiario * 7;
    const ahorroMensual =
        ahorroDiario * 30;
    document.getElementById(
        "tituloMeta"
    ).innerText =
        "🎯 " + datos.nombre;
    document.getElementById(
        "porcentaje"
    ).innerText =
        Math.round(porcentaje) + "%";
    document.getElementById(
        "resultadoMeta"
    ).innerText =
        dinero(meta);
    document.getElementById(
        "resultadoAhorrado"
    ).innerText =
        dinero(ahorrado);
    document.getElementById(
        "resultadoFalta"
    ).innerText =
        dinero(falta);
    document.getElementById(
        "diasRestantes"
    ).innerText =
        dias;
    document.getElementById(
        "porDia"
    ).innerText =
        dias > 0 ? dinero(ahorroDiario) : "$0";
    document.getElementById(
        "porSemana"
    ).innerText =
        dias > 0 ? dinero(ahorroSemanal) : "$0";
    document.getElementById(
        "porMes"
    ).innerText =
        dias > 0 ? dinero(ahorroMensual) : "$0";
    document.getElementById(
        "progressCircle"
    ).style.background =
        `conic-gradient(
            #22c55e
            ${porcentaje}%,
            #e5e7eb
            ${porcentaje}%
        )`;
    if (falta <= 0) {
        document.getElementById(
            "mensaje"
        ).innerText =
            "🎉 ¡Felicidades! Ya alcanzaste tu meta de ahorro.";
    }
    else {
        document.getElementById(
            "mensaje"
        ).innerText =
            "💪 Si mantienes este ritmo de ahorro, podrás alcanzar tu meta antes de la fecha límite.";
    }
}
/* AGREGAR AHORRO */
function agregarAhorro() {
    const cantidad =
        Number(
            document.getElementById(
                "nuevoAhorro"
            ).value
        );
    if (cantidad <= 0) {
        alert(
            "Introduce una cantidad válida."
        );
        return;
    }
    const datosGuardados =
        localStorage.getItem(
            "miSistemaDeAhorro"
        );
    const datos =
        JSON.parse(datosGuardados);
    datos.ahorrado += cantidad;
    localStorage.setItem(
        "miSistemaDeAhorro",
        JSON.stringify(datos)
    );
    document.getElementById(
        "nuevoAhorro"
    ).value = "";
    mostrarDatos();
}
/* ELIMINAR DATOS */
function eliminarDatos() {
    const confirmar = confirm(
        "¿Seguro que quieres eliminar todos tus datos?"
    );
    if (confirmar) {
        localStorage.removeItem(
            "miSistemaDeAhorro"
        );
        location.reload();
    }
}
/* CARGAR AUTOMÁTICAMENTE */
window.onload = function() {
    mostrarDatos();
};
</script>
</body>
</html>
